<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord RPC — Custom Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }

        .container {
            display: flex;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .form-panel {
            background: #16213e;
            border-radius: 12px;
            padding: 28px;
            flex: 1;
            min-width: 380px;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-panel h1 {
            font-size: 20px;
            margin-bottom: 6px;
            color: #7289da;
        }

        .form-panel .subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .connection-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .connection-status.connected {
            background: rgba(67, 181, 129, 0.15);
            color: #43b581;
        }

        .connection-status.connected .dot {
            background: #43b581;
        }

        .connection-status.disconnected {
            background: rgba(240, 71, 71, 0.15);
            color: #f04747;
        }

        .connection-status.disconnected .dot {
            background: #f04747;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: #8e9297;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .form-group input[type="text"],
        .form-group input[type="url"] {
            width: 100%;
            background: #0f3460;
            border: 1px solid #2a4a7f;
            border-radius: 6px;
            padding: 9px 12px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #7289da;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* Activity Type Selector */
        .activity-type-selector {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            margin-bottom: 6px;
        }

        .activity-type-btn {
            flex: 1;
            cursor: pointer;
        }

        .activity-type-btn input {
            display: none;
        }

        .activity-type-btn span {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 9px 8px;
            background: #0f3460;
            border: 1px solid #2a4a7f;
            border-radius: 6px;
            color: #b9bbbe;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
            user-select: none;
        }

        .activity-type-btn:hover span {
            background: #144272;
            color: #ffffff;
            border-color: #3b629b;
        }

        .activity-type-btn input:checked + span {
            background: #7289da;
            color: #ffffff;
            border-color: #8ea1e1;
            box-shadow: 0 0 10px rgba(114, 137, 218, 0.4);
        }

        /* Buttons Config Section */
        .button-card {
            background: rgba(15, 52, 96, 0.35);
            border: 1px solid #2a4a7f;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .button-fields {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #2a4a7f;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #7289da;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 13px;
            color: #b9bbbe;
            cursor: pointer;
            text-transform: none;
            font-weight: 500;
        }

        .separator {
            border: none;
            border-top: 1px solid #2a4a7f;
            margin: 18px 0;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: #7289da;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #7289da;
            color: white;
        }

        .btn-primary:hover {
            background: #677bc4;
        }

        .btn-danger {
            background: #f04747;
            color: white;
        }

        .btn-danger:hover {
            background: #d83c3c;
        }

        .btn-secondary {
            background: #4f545c;
            color: white;
        }

        .btn-secondary:hover {
            background: #5d6269;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .preview-panel {
            min-width: 320px;
            max-width: 360px;
        }

        .preview-panel h2 {
            font-size: 14px;
            text-transform: uppercase;
            font-weight: 700;
            color: #8e9297;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .discord-card {
            background: #2f3136;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .discord-card-header {
            background: #202225;
            padding: 10px 14px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            color: #8e9297;
            letter-spacing: 0.5px;
        }

        .discord-card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dc-main {
            display: flex;
            gap: 14px;
            width: 100%;
        }

        .dc-images {
            position: relative;
            flex-shrink: 0;
            width: 64px;
            height: 64px;
        }

        .dc-large-img {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            object-fit: cover;
            background: #40444b;
        }

        .dc-small-img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            background: #40444b;
            border: 3px solid #2f3136;
            position: absolute;
            bottom: -4px;
            right: -4px;
        }

        .dc-info {
            flex: 1;
            min-width: 0;
        }

        .dc-app-name {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dc-details,
        .dc-state,
        .dc-time {
            font-size: 12px;
            color: #b9bbbe;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dc-time {
            color: #72767d;
        }

        /* Discord Preview Buttons */
        .dc-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }

        .dc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            background: #4f545c;
            color: #ffffff;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.15s ease, transform 0.1s ease;
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
        }

        .dc-btn:hover {
            background: #5d6269;
        }

        .dc-btn svg {
            width: 13px;
            height: 13px;
            fill: currentColor;
            opacity: 0.85;
            flex-shrink: 0;
        }

        .dc-empty {
            color: #555;
            font-style: italic;
            font-size: 13px;
            text-align: center;
            padding: 30px 14px;
        }

        .hidden {
            display: none !important;
        }

        .img-tooltip {
            position: relative;
        }

        .img-tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #18191c;
            color: #dcddde;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="form-panel">
            <h1>Custom Discord Status</h1>
            <p class="subtitle">Configura tu estado personalizado de Discord y conéctalo al bridge</p>

            <div id="connStatus" class="connection-status disconnected">
                <span class="dot"></span>
                <span id="connText">Disconnected</span>
            </div>

            <hr class="separator">

            <!-- Activity Type Selector -->
            <div class="form-group">
                <label>Tipo de Actividad / Activity Type</label>
                <div class="activity-type-selector">
                    <label class="activity-type-btn">
                        <input type="radio" name="activityType" value="playing" checked>
                        <span>🎮 Playing</span>
                    </label>
                    <label class="activity-type-btn">
                        <input type="radio" name="activityType" value="listening">
                        <span>🎧 Listening</span>
                    </label>
                    <label class="activity-type-btn">
                        <input type="radio" name="activityType" value="watching">
                        <span>📺 Watching</span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Details (Línea 1)</label>
                <input type="text" id="rpcDetails" placeholder="Playing something cool..." maxlength="128">
            </div>
            <div class="form-group">
                <label>State (Línea 2)</label>
                <input type="text" id="rpcState" placeholder="Having fun" maxlength="128">
            </div>

            <hr class="separator">

            <div class="section-title">Imágenes</div>
            <div class="form-group">
                <label>Large Image URL / Asset Key</label>
                <input type="url" id="rpcLargeImg" placeholder="https://example.com/image.png">
            </div>
            <div class="form-group">
                <label>Large Image Tooltip</label>
                <input type="text" id="rpcLargeText" placeholder="My cool image" maxlength="128">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Small Image URL / Asset Key</label>
                    <input type="url" id="rpcSmallImg" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Small Image Tooltip</label>
                    <input type="text" id="rpcSmallText" placeholder="Icon" maxlength="128">
                </div>
            </div>

            <hr class="separator">

            <div class="checkbox-group">
                <input type="checkbox" id="rpcTimer">
                <label for="rpcTimer">Mostrar tiempo transcurrido (Elapsed time)</label>
            </div>
            <div class="form-group" id="timerInputGroup" style="display:none">
                <label>Tiempo inicial (HH:MM:SS)</label>
                <input type="text" id="rpcTimerValue" placeholder="00:00:00" maxlength="8">
            </div>

            <hr class="separator">

            <!-- Optional Buttons Section -->
            <div class="section-title">Botones (Opcional)</div>

            <!-- Button 1 -->
            <div class="button-card">
                <div class="checkbox-group" style="margin-bottom: 0;">
                    <input type="checkbox" id="rpcBtn1Enable">
                    <label for="rpcBtn1Enable">Habilitar Botón 1</label>
                </div>
                <div id="btn1Group" class="button-fields" style="display:none;">
                    <div class="form-group">
                        <label>Texto del Botón 1</label>
                        <input type="text" id="rpcBtn1Text" placeholder="Ej: Visitar Web / Visit Website" maxlength="32">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Enlace URL (Link)</label>
                        <input type="url" id="rpcBtn1Url" placeholder="https://ejemplo.com" maxlength="512">
                    </div>
                </div>
            </div>

            <!-- Button 2 -->
            <div class="button-card">
                <div class="checkbox-group" style="margin-bottom: 0;">
                    <input type="checkbox" id="rpcBtn2Enable">
                    <label for="rpcBtn2Enable">Habilitar Botón 2</label>
                </div>
                <div id="btn2Group" class="button-fields" style="display:none;">
                    <div class="form-group">
                        <label>Texto del Botón 2</label>
                        <input type="text" id="rpcBtn2Text" placeholder="Ej: Únete a mi Discord" maxlength="32">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Enlace URL (Link)</label>
                        <input type="url" id="rpcBtn2Url" placeholder="https://discord.gg/ejemplo" maxlength="512">
                    </div>
                </div>
            </div>

            <hr class="separator">

            <div class="actions">
                <button id="btnActivate" class="btn btn-primary">Activate</button>
                <button id="btnDeactivate" class="btn btn-danger hidden">Deactivate</button>
                <button id="btnSave" class="btn btn-secondary">Save Config</button>
            </div>
        </div>

        <div class="preview-panel">
            <h2>Preview</h2>
            <div class="discord-card">
                <div class="discord-card-header" id="cardHeader">PLAYING A GAME</div>
                <div id="previewContent">
                    <div class="dc-empty">Configure your status and press Activate</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const els = {
            details: document.getElementById("rpcDetails"),
            state: document.getElementById("rpcState"),
            largeImg: document.getElementById("rpcLargeImg"),
            largeText: document.getElementById("rpcLargeText"),
            smallImg: document.getElementById("rpcSmallImg"),
            smallText: document.getElementById("rpcSmallText"),
            timer: document.getElementById("rpcTimer"),
            timerValue: document.getElementById("rpcTimerValue"),
            timerInputGroup: document.getElementById("timerInputGroup"),
            btn1Enable: document.getElementById("rpcBtn1Enable"),
            btn1Group: document.getElementById("btn1Group"),
            btn1Text: document.getElementById("rpcBtn1Text"),
            btn1Url: document.getElementById("rpcBtn1Url"),
            btn2Enable: document.getElementById("rpcBtn2Enable"),
            btn2Group: document.getElementById("btn2Group"),
            btn2Text: document.getElementById("rpcBtn2Text"),
            btn2Url: document.getElementById("rpcBtn2Url"),
            activate: document.getElementById("btnActivate"),
            deactivate: document.getElementById("btnDeactivate"),
            save: document.getElementById("btnSave"),
            connStatus: document.getElementById("connStatus"),
            connText: document.getElementById("connText"),
            cardHeader: document.getElementById("cardHeader"),
            preview: document.getElementById("previewContent"),
        };

        let active = false;
        let startTime = null;
        let socket = null;

        // ---- Activity Type Helpers ----
        function getActivityType() {
            const checked = document.querySelector('input[name="activityType"]:checked');
            return checked ? checked.value : "playing";
        }

        function setActivityType(type) {
            const radio = document.querySelector(`input[name="activityType"][value="${type}"]`);
            if (radio) {
                radio.checked = true;
            }
        }

        // ---- Button Toggles ----
        els.btn1Enable.addEventListener("change", () => {
            els.btn1Group.style.display = els.btn1Enable.checked ? "" : "none";
            if (active) sendRPC();
            updatePreview();
        });

        els.btn2Enable.addEventListener("change", () => {
            els.btn2Group.style.display = els.btn2Enable.checked ? "" : "none";
            if (active) sendRPC();
            updatePreview();
        });

        // ---- Activity Radios change ----
        document.querySelectorAll('input[name="activityType"]').forEach(r => {
            r.addEventListener("change", () => {
                if (active) sendRPC();
                updatePreview();
            });
        });

        // ---- Timer checkbox toggle ----
        els.timer.addEventListener("change", () => {
            els.timerInputGroup.style.display = els.timer.checked ? "" : "none";
            if (!els.timer.checked) {
                startTime = null;
            }
            if (active) sendRPC();
            updatePreview();
        });

        function parseTimeInput(val) {
            const parts = val.trim().split(":").map(Number);
            if (parts.some(isNaN)) return 0;
            if (parts.length === 3) return (parts[0] * 3600 + parts[1] * 60 + parts[2]) * 1000;
            if (parts.length === 2) return (parts[0] * 60 + parts[1]) * 1000;
            if (parts.length === 1) return parts[0] * 1000;
            return 0;
        }

        function msToTimeInput(ms) {
            const totalSec = Math.floor(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        }

        // ---- WebSocket ----
        function connect() {
            socket = new WebSocket("ws://127.0.0.1:6680");

            socket.onopen = () => {
                els.connStatus.className = "connection-status connected";
                els.connText.textContent = "Connected to bridge";
                try {
                    socket.send(JSON.stringify({ action: "query", source: "custom" }));
                } catch (e) { }
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === "queryResponse" && data.source === "custom") {
                        if (data.active && data.persistent) {
                            active = true;
                            if (data.rpc) {
                                if (data.rpc.activityType) {
                                    setActivityType(data.rpc.activityType);
                                } else if (typeof data.rpc.type === "number") {
                                    const revMap = { 0: "playing", 2: "listening", 3: "watching" };
                                    if (revMap[data.rpc.type]) setActivityType(revMap[data.rpc.type]);
                                }

                                if (data.rpc.details) els.details.value = data.rpc.details;
                                if (data.rpc.state) els.state.value = data.rpc.state;
                                if (data.rpc.largeImageKey) els.largeImg.value = data.rpc.largeImageKey;
                                if (data.rpc.largeImageText) els.largeText.value = data.rpc.largeImageText;
                                if (data.rpc.smallImageKey) els.smallImg.value = data.rpc.smallImageKey;
                                if (data.rpc.smallImageText) els.smallText.value = data.rpc.smallImageText;

                                if (Array.isArray(data.rpc.buttons)) {
                                    if (data.rpc.buttons[0]) {
                                        els.btn1Enable.checked = true;
                                        els.btn1Group.style.display = "";
                                        els.btn1Text.value = data.rpc.buttons[0].label || "";
                                        els.btn1Url.value = data.rpc.buttons[0].url || "";
                                    }
                                    if (data.rpc.buttons[1]) {
                                        els.btn2Enable.checked = true;
                                        els.btn2Group.style.display = "";
                                        els.btn2Text.value = data.rpc.buttons[1].label || "";
                                        els.btn2Url.value = data.rpc.buttons[1].url || "";
                                    }
                                }

                                if (data.rpc.startTimestamp) {
                                    startTime = typeof data.rpc.startTimestamp === "number"
                                        ? (data.rpc.startTimestamp < 1e12
                                            ? data.rpc.startTimestamp * 1000
                                            : data.rpc.startTimestamp)
                                        : Date.now();
                                    els.timer.checked = true;
                                    els.timerInputGroup.style.display = "";
                                    els.timerValue.value = msToTimeInput(Date.now() - startTime);
                                } else {
                                    startTime = null;
                                    els.timer.checked = false;
                                    els.timerInputGroup.style.display = "none";
                                }
                            }
                            els.activate.classList.add("hidden");
                            els.deactivate.classList.remove("hidden");
                            updatePreview();
                        } else {
                            active = false;
                            startTime = null;
                            if (data.active && !data.persistent) {
                                try {
                                    socket.send(JSON.stringify({ source: "custom", action: "remove" }));
                                } catch (ex) { }
                            }
                            els.deactivate.classList.add("hidden");
                            els.activate.classList.remove("hidden");
                            updatePreview();
                        }
                    }
                } catch (e) { }
            };

            socket.onclose = () => {
                els.connStatus.className = "connection-status disconnected";
                els.connText.textContent = "Disconnected — retrying...";
                setTimeout(connect, 5000);
            };

            socket.onerror = () => { };
        }

        connect();

        // ---- Build RPC payload ----
        function buildPayload() {
            const rpc = {};

            const actType = getActivityType();
            const typeMap = { playing: 0, listening: 2, watching: 3 };
            rpc.type = typeMap[actType] !== undefined ? typeMap[actType] : 0;
            rpc.activityType = actType;

            const details = els.details.value.trim();
            const state = els.state.value.trim();
            if (details) rpc.details = details;
            if (state) rpc.state = state;

            const largeImg = els.largeImg.value.trim();
            const largeText = els.largeText.value.trim();
            if (largeImg) rpc.largeImageKey = largeImg;
            if (largeText) rpc.largeImageText = largeText;

            const smallImg = els.smallImg.value.trim();
            const smallText = els.smallText.value.trim();
            if (smallImg) rpc.smallImageKey = smallImg;
            if (smallText) rpc.smallImageText = smallText;

            // Timer / Timestamps
            if (els.timer.checked) {
                if (!startTime) {
                    const customMs = parseTimeInput(els.timerValue.value);
                    startTime = Date.now() - customMs;
                }
                rpc.startTimestamp = startTime;
            } else {
                rpc.startTimestamp = null;
                startTime = null;
            }

            // Buttons
            const buttons = [];
            if (els.btn1Enable.checked) {
                const label = els.btn1Text.value.trim();
                const url = els.btn1Url.value.trim();
                if (label) {
                    buttons.push({ label, url: url || "https://discord.com" });
                }
            }
            if (els.btn2Enable.checked) {
                const label = els.btn2Text.value.trim();
                const url = els.btn2Url.value.trim();
                if (label) {
                    buttons.push({ label, url: url || "https://discord.com" });
                }
            }
            if (buttons.length > 0) {
                rpc.buttons = buttons;
            }

            return { source: "custom", priority: 4, persistent: true, rpc };
        }

        // ---- Send ----
        function sendRPC() {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            try {
                socket.send(JSON.stringify(buildPayload()));
            } catch (e) { }
        }

        function removeRPC() {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            try {
                socket.send(JSON.stringify({ source: "custom", action: "remove" }));
            } catch (e) { }
        }

        // ---- Activate / Deactivate ----
        els.activate.addEventListener("click", () => {
            active = true;
            if (els.timer.checked) {
                const customMs = parseTimeInput(els.timerValue.value);
                startTime = Date.now() - customMs;
            } else {
                startTime = null;
            }
            els.activate.classList.add("hidden");
            els.deactivate.classList.remove("hidden");
            sendRPC();
            updatePreview();
            localStorage.setItem("customRpcConfig", JSON.stringify(getConfig()));
        });

        els.deactivate.addEventListener("click", () => {
            active = false;
            startTime = null;
            els.deactivate.classList.add("hidden");
            els.activate.classList.remove("hidden");
            removeRPC();
            updatePreview();
            localStorage.setItem("customRpcConfig", JSON.stringify(getConfig()));
        });

        // ---- Save / Load config ----
        function getConfig() {
            return {
                active: active,
                activityType: getActivityType(),
                details: els.details.value,
                state: els.state.value,
                largeImg: els.largeImg.value,
                largeText: els.largeText.value,
                smallImg: els.smallImg.value,
                smallText: els.smallText.value,
                timer: els.timer.checked,
                timerValue: els.timerValue.value,
                btn1Enable: els.btn1Enable.checked,
                btn1Text: els.btn1Text.value,
                btn1Url: els.btn1Url.value,
                btn2Enable: els.btn2Enable.checked,
                btn2Text: els.btn2Text.value,
                btn2Url: els.btn2Url.value,
            };
        }

        function loadConfig(cfg) {
            if (!cfg) return;
            if (cfg.activityType) setActivityType(cfg.activityType);
            els.details.value = cfg.details || "";
            els.state.value = cfg.state || "";
            els.largeImg.value = cfg.largeImg || "";
            els.largeText.value = cfg.largeText || "";
            els.smallImg.value = cfg.smallImg || "";
            els.smallText.value = cfg.smallText || "";
            els.timer.checked = !!cfg.timer;
            els.timerValue.value = cfg.timerValue || "00:00:00";
            els.timerInputGroup.style.display = cfg.timer ? "" : "none";

            els.btn1Enable.checked = !!cfg.btn1Enable;
            els.btn1Text.value = cfg.btn1Text || "";
            els.btn1Url.value = cfg.btn1Url || "";
            els.btn1Group.style.display = cfg.btn1Enable ? "" : "none";

            els.btn2Enable.checked = !!cfg.btn2Enable;
            els.btn2Text.value = cfg.btn2Text || "";
            els.btn2Url.value = cfg.btn2Url || "";
            els.btn2Group.style.display = cfg.btn2Enable ? "" : "none";

            startTime = null;
        }

        els.save.addEventListener("click", () => {
            localStorage.setItem("customRpcConfig", JSON.stringify(getConfig()));
            els.save.textContent = "Saved!";
            setTimeout(() => { els.save.textContent = "Save Config"; }, 1500);
        });

        try {
            const saved = localStorage.getItem("customRpcConfig");
            if (saved) loadConfig(JSON.parse(saved));
        } catch (e) { }

        // ---- Live Preview ----
        function updatePreview() {
            const actType = getActivityType();
            const headerTitles = {
                playing: "PLAYING A GAME",
                listening: "LISTENING TO",
                watching: "WATCHING"
            };
            els.cardHeader.textContent = headerTitles[actType] || "PLAYING A GAME";

            if (!active) {
                els.preview.innerHTML = '<div class="dc-empty">Configure your status and press Activate</div>';
                return;
            }

            const details = els.details.value.trim() || "No details set";
            const state = els.state.value.trim();
            const largeImg = els.largeImg.value.trim();
            const largeText = els.largeText.value.trim();
            const smallImg = els.smallImg.value.trim();
            const smallText = els.smallText.value.trim();
            const showTimer = els.timer.checked;

            // Buttons for preview
            const previewButtons = [];
            if (els.btn1Enable.checked) {
                previewButtons.push({
                    label: els.btn1Text.value.trim() || "Button 1",
                    url: els.btn1Url.value.trim()
                });
            }
            if (els.btn2Enable.checked) {
                previewButtons.push({
                    label: els.btn2Text.value.trim() || "Button 2",
                    url: els.btn2Url.value.trim()
                });
            }

            let html = '<div class="discord-card-body">';
            html += '<div class="dc-main">';

            if (largeImg) {
                html += '<div class="dc-images">';
                html += `<img class="dc-large-img img-tooltip" src="${escapeHtml(largeImg)}" data-tooltip="${escapeHtml(largeText)}" onerror="this.style.display='none'" alt="">`;
                if (smallImg) {
                    html += `<img class="dc-small-img img-tooltip" src="${escapeHtml(smallImg)}" data-tooltip="${escapeHtml(smallText)}" onerror="this.style.display='none'" alt="">`;
                }
                html += '</div>';
            }

            html += '<div class="dc-info">';
            html += `<div class="dc-app-name">Custom Status</div>`;
            html += `<div class="dc-details">${escapeHtml(details)}</div>`;
            if (state) html += `<div class="dc-state">${escapeHtml(state)}</div>`;
            if (showTimer && startTime) {
                const elapsed = formatElapsed(Date.now() - startTime);
                html += `<div class="dc-time">${elapsed} elapsed</div>`;
            }
            html += '</div></div>'; // .dc-info and .dc-main

            // Render buttons in preview if any enabled
            if (previewButtons.length > 0) {
                html += '<div class="dc-buttons">';
                previewButtons.forEach(btn => {
                    const hasValidUrl = btn.url && (btn.url.startsWith("http://") || btn.url.startsWith("https://"));
                    const targetAttr = hasValidUrl ? 'target="_blank" rel="noopener noreferrer"' : 'onclick="return false;"';
                    const hrefAttr = hasValidUrl ? `href="${escapeHtml(btn.url)}"` : 'href="#"';
                    html += `
                        <a class="dc-btn" ${hrefAttr} ${targetAttr}>
                            <span>${escapeHtml(btn.label)}</span>
                            <svg viewBox="0 0 24 24"><path d="M10 5V3H5.75C4.23122 3 3 4.23122 3 5.75V18.25C3 19.7688 4.23122 21 5.75 21H18.25C19.7688 21 21 19.7688 21 18.25V14H19V18.25C19 18.6642 18.6642 19 18.25 19H5.75C5.33579 19 5 18.6642 5 18.25V5.75C5 5.33579 5.33579 5 5.75 5H10ZM14 3V5H17.59L8.29 14.29L9.71 15.71L19 6.41V10H21V3H14Z"/></svg>
                        </a>`;
                });
                html += '</div>';
            }

            html += '</div>'; // .discord-card-body

            els.preview.innerHTML = html;
        }

        function escapeHtml(str) {
            const d = document.createElement("div");
            d.textContent = str;
            return d.innerHTML;
        }

        function formatElapsed(ms) {
            const totalSec = Math.floor(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            if (h > 0) return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
            return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        }

        // Listen for all input/change events to update live
        document.addEventListener("input", (e) => {
            if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) {
                if (active) sendRPC();
                updatePreview();
            }
        });

        document.addEventListener("change", (e) => {
            if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")) {
                if (active) sendRPC();
                updatePreview();
            }
        });

        // Live preview timer tick
        setInterval(() => { if (active) updatePreview(); }, 1000);
        updatePreview();
    </script>
</body>

</html>
